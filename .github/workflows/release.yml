# Builds Call-it.exe and publishes a GitHub Release.
# Runs when the release branch is pushed (the version comes from index.html), or when a version tag (v*) is pushed.
# Release notes come from release-notes/<tag>.md when that file exists.
name: Release
on:
  push:
    branches: [release]
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; else TAG=$(grep -o 'aria-label="Version">v[0-9.]*' index.html | grep -o 'v[0-9.]*$'); fi
          test -n "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"
      - name: Build Call-it.exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la Call-it.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "release-notes/$TAG.md" ]; then NOTES=(--notes-file "release-notes/$TAG.md"); else NOTES=(--generate-notes); fi
          gh release create "$TAG" desktop/Call-it.exe --target "$GITHUB_SHA" --title "Call it. $TAG" "${NOTES[@]}"
