/* layout: run panel on the left, joker tray + coin table on the right; stacks into a top HUD on phones.
   Single committed look: a dark smoky card table over a swirling paint shader. */
:root{
  --void:#171512;
  --panel:#47423b; --panel-hi:#5e574d; --panel-deep:#25221e; --edge:#110f0d;
  --ink:#ffffff; --ink-dim:#c9bda9;
  --chips:#0b9bff; --chips-d:#0864ad;
  --mult:#fe5f55; --mult-d:#a8352e;
  --money:#f5b744; --money-d:#9c6b14;
  --green:#3fbf8b; --green-d:#21785a;
  --orange:#ff9a1f; --orange-d:#ad6007;
  --purple:#9a6fdc; --purple-d:#5d3d94;
  --cyan:#27b3d6; --grey:#6e675d; --grey-d:#3f3a33;
  --font:'HWR Num','HWR Text','Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --cs:72px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font);font-synthesis:none;font-variant-ligatures:none;font-size:16px;line-height:1.15;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.35)}
button{font:inherit;color:inherit;text-shadow:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;
  background:radial-gradient(circle at 30% 30%,#8a7448,#171512)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:80;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;height:100%;transform-origin:0 0;display:grid;grid-template-columns:minmax(250px,290px) minmax(0,1fr);gap:16px;padding:14px 16px}
#app.shake{animation:shake .35s cubic-bezier(.3,.7,.4,1)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(calc(var(--amp)*-1),calc(var(--amp)*.6))}40%{transform:translate(var(--amp),calc(var(--amp)*-.5))}60%{transform:translate(calc(var(--amp)*-.6),calc(var(--amp)*.3))}80%{transform:translate(calc(var(--amp)*.3),0)}100%{transform:translate(0,0)}}
#side{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:14px;padding:10px;
  box-shadow:0 5px 0 var(--edge),inset 0 0 0 2px rgba(255,255,255,.06);overflow:auto;min-height:0}
#main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}
#stage{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;min-width:0}

.lbl{font-size:13px;color:var(--ink-dim);letter-spacing:.04em}
.box{background:var(--panel-deep);border-radius:10px;padding:8px}

/* sidebar parts */
.s-blind{flex-shrink:0;border-radius:10px;overflow:hidden;background:var(--panel-deep);box-shadow:0 3px 0 var(--edge)}
.s-bname{background:var(--bc);text-align:center;font-size:22px;font-weight:700;padding:6px 8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.s-binfo{display:flex;align-items:center;gap:10px;padding:8px 10px}
.s-target{font-size:26px;font-weight:700;color:var(--mult);font-variant-numeric:tabular-nums}
.s-bdesc{padding:0 10px 8px;font-size:14px;color:#ffd7d3}
.bchip{--sz:44px;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;background:var(--bc);display:grid;place-items:center;font-weight:700;font-size:calc(var(--sz)*.42);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.25),inset 0 0 0 calc(var(--sz)*.18) rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.4)}
.s-score{display:flex;align-items:center;gap:10px}
.s-score .lbl{width:58px;text-align:center}
.s-score .val{flex:1;background:var(--panel);border-radius:8px;padding:6px 10px;font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.s-hand{position:relative}
.hname{text-align:center;font-size:22px;font-weight:600;min-height:28px;display:flex;justify-content:center;align-items:baseline;gap:8px}
.hname small{font-size:14px;color:var(--ink-dim)}
.cm{display:flex;align-items:center;gap:6px;margin-top:6px}
.cm b{color:var(--mult);font-size:22px}
.cm .chips,.cm .mult{flex:1;border-radius:8px;padding:6px 10px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;white-space:nowrap}
.cm .chips{background:var(--chips);text-align:right;box-shadow:0 3px 0 var(--chips-d)}
.cm .mult{background:var(--mult);text-align:left;box-shadow:0 3px 0 var(--mult-d)}
.s-hand.fire .chips,.s-hand.fire .mult{animation:fire .5s ease-in-out infinite alternate}
@keyframes fire{from{box-shadow:0 3px 0 rgba(0,0,0,.3),0 -4px 14px 2px #ff9a1f}to{box-shadow:0 3px 0 rgba(0,0,0,.3),0 -10px 22px 6px #ffd23f}}
.s-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-deep);border-radius:10px;padding:6px 8px;text-align:center}
.stat.wide{grid-column:span 2}
.qlist{background:var(--panel-deep);border-radius:10px;padding:8px 10px;margin:0 0 10px;display:grid;gap:6px}
.qrow{font-size:13px;line-height:1.35;border-left:3px solid #a8743a;padding-left:8px}.qrow small{color:var(--ink-dim)}
.sumimg{width:100%;border-radius:10px;image-rendering:auto;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.lbbox{background:var(--panel-deep);border-radius:10px;padding:8px 10px;margin-top:10px}
.lbt{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}.lbt td{padding:3px 6px;border-top:1px solid rgba(255,255,255,.06)}
.lbt .rk{color:var(--ink-dim);width:2ch}.lbt .bt{text-align:right;font-variant-numeric:tabular-nums}.lbt tr.me td{background:rgba(255,211,77,.12)}
.cdetail.anim>.cic{animation:colpop .4s cubic-bezier(.2,1.6,.4,1)}
.cdetail.anim.charms>.cic,.cdetail.anim.almanacs>.cic,.cdetail.anim.runes>.cic,.cdetail.anim.spirits>.cic,.cdetail.anim.fortunes>.cic,.cdetail.anim.curses>.cic{animation:colpop .4s cubic-bezier(.2,1.6,.4,1),colsway 2.8s ease-in-out .4s infinite;transform-origin:50% 0}
@keyframes colpop{from{transform:scale(.6) rotate(-8deg);opacity:.3}}
@keyframes colsway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.cflip{perspective:420px;background:none!important}
.cfi{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:colflip 2.6s cubic-bezier(.45,0,.55,1) infinite}
.cfi img{position:absolute;inset:6%;width:88%;height:88%;backface-visibility:hidden;image-rendering:pixelated}
.cfi .cft{transform:rotateY(180deg)}
@keyframes colflip{0%,20%{transform:rotateY(0)}50%,70%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.citem:hover>.cic{animation:colwig .5s ease-in-out}
@keyframes colwig{25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.citem.on>.cic{animation:colbob 1.4s ease-in-out infinite}
@keyframes colbob{50%{transform:translateY(-3px)}}
.gpopt .jcard,.gpk{animation:glitchjit 1.3s steps(1) infinite}
.bcol{position:relative}
.blinds .bcol:not(:last-child)::after{content:'';position:absolute;right:-11px;top:50%;width:10px;height:3px;border-radius:2px;background:rgba(255,236,190,.35)}
.waysbox{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.waysbox .ptitle{color:#e9d9a8;text-align:center}
.ways .bcol::after{display:none!important}
.way .jcard{width:clamp(52px,8vmin,76px)}
.way .jin img{width:70%;height:70%;image-rendering:pixelated}
.way .jin{box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 3px var(--nc,#e9d9a8),inset 0 0 0 5px rgba(0,0,0,.2);animation:mappulse2 1.6s ease-in-out infinite}
@keyframes mappulse2{50%{box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 5px var(--nc),0 0 16px var(--nc)}}
.way .jcard:hover .jin{transform:translateY(-3px) scale(1.06)}
.way .wsub{font-size:13px;color:#d8d2c4;line-height:1.3;flex:1}
.way.rare .bname{box-shadow:0 0 14px var(--bc)}
.fataltxt{color:#ff5fd2;text-shadow:-2px 0 #00f0e0,2px 0 #ff1aa8}
.sdfatal .sdname{position:relative;text-shadow:-3px 0 #00f0e0,3px 0 #ff1aa8;animation:glitchjit .9s steps(1) infinite}
.sdfatal .sdlbl{color:#00f0e0}
.dosl{font-size:34px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.s-contract{font-size:12px;color:#e9d9a8;background:rgba(0,0,0,.25);border-left:3px solid #a8743a;border-radius:6px;padding:4px 8px;margin-top:6px}
.fabled .jcard::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#ff5f6d,#ffd34d,#4bd18f,#0b9bff,#c9a4ff,#ff5f6d);animation:fabspin 2.6s linear infinite;z-index:-1;box-shadow:0 0 18px rgba(255,157,226,.6)}
.fabled .jcard::after{content:'';position:absolute;inset:-14px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 18% 22%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 82% 30%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 85%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 25% 78%,#fff 0 1px,transparent 2px);animation:fabtwinkle 1.6s ease-in-out infinite}
@keyframes fabspin{to{transform:rotate(360deg)}}
@keyframes fabtwinkle{50%{opacity:.15;transform:rotate(20deg) scale(1.06)}}
.scard.fabled .price{background:linear-gradient(90deg,#ff5f6d,#ffd34d,#4bd18f,#0b9bff,#c9a4ff);color:#1a1a1a}
#wx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
.wxbanner{font-size:14px;color:var(--ink-dim);background:rgba(0,0,0,.35);border:2px solid var(--wc);border-radius:10px;padding:5px 12px;text-align:center;max-width:min(640px,100%)}
.wxbanner b{color:var(--wc)}
.coin.bolted::before{content:'';position:absolute;inset:-6%;border-radius:50%;box-shadow:0 0 16px 4px rgba(190,180,255,.75),inset 0 0 10px rgba(220,215,255,.6);pointer-events:none;animation:boltpulse .9s ease-in-out infinite}
@keyframes boltpulse{50%{box-shadow:0 0 26px 8px rgba(190,180,255,.95),inset 0 0 14px rgba(220,215,255,.8)}}
.seedrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#seedin{font:inherit;font-size:15px;letter-spacing:.12em;text-transform:uppercase;width:150px;padding:5px 8px;border-radius:8px;border:2px solid rgba(255,255,255,.18);background:var(--panel-deep);color:#fff}
#seedin:focus{outline:2px solid var(--orange);outline-offset:1px}
.seedv{display:flex;align-items:center;gap:6px;letter-spacing:.08em}
input.vol{width:150px;accent-color:var(--orange)}
.stctl{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.stctl .optrow>span{display:flex;flex-direction:column}.stctl .optrow small{font-size:11px;color:var(--ink-dim)}
.stctl .optrow{flex-wrap:wrap;gap:6px}.stsg{display:flex;gap:3px;flex:0 1 auto;margin-left:auto}.stsg .btn{flex:1 1 0;min-width:28px;padding:5px 6px}
@media (max-width:520px){.stsg{flex:1 1 100%}
  /* phones: one column in its own scrolling list, title and buttons stay put */
  .stm{display:flex;flex-direction:column;overflow:hidden}
  .stm .sttracks{grid-template-columns:1fr;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--ink-dim) transparent}
  .stm .sttracks::-webkit-scrollbar{width:6px}.stm .sttracks::-webkit-scrollbar-thumb{background:var(--ink-dim);border-radius:3px}}
.sbuys{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.sbuys .btn{white-space:nowrap}
.sttracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sttracks .btn{min-width:0;white-space:normal;line-height:1.15}.sttracks small{white-space:normal;min-width:0}
.sttracks .btn{justify-content:flex-start;text-align:left;gap:8px;display:flex;align-items:center;flex-wrap:wrap}
.sttracks .stn{opacity:.6;font-variant-numeric:tabular-nums}
.sttracks small{flex-basis:100%;font-size:10px;opacity:.85}
.rain{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.rain img{position:absolute;top:0;image-rendering:pixelated;border-radius:50%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.fanfare{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.55);animation:fanin .25s ease-out;cursor:pointer;padding:16px}
.fanfare.out{animation:fanout .3s ease-in forwards}
@keyframes fanin{from{opacity:0}}@keyframes fanout{to{opacity:0}}
.fanrays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,211,77,.12) 0 10deg,transparent 10deg 20deg);animation:fanspin 14s linear infinite;pointer-events:none}
@keyframes fanspin{to{transform:rotate(360deg)}}
.fancard{position:relative;background:var(--panel);border-radius:16px;padding:18px 22px;max-width:360px;text-align:center;box-shadow:0 6px 0 var(--edge),inset 0 0 0 3px var(--money),0 0 50px rgba(255,211,77,.35);animation:fanpop .5s cubic-bezier(.2,1.6,.4,1);zoom:var(--k,1)}
@keyframes fanpop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.fantag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--money)}
.fanic{width:96px;height:96px;margin:12px auto 4px;border-radius:50%;background:var(--jbg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #d9b552,0 0 24px rgba(255,211,77,.6);animation:fanwig 1.6s ease-in-out infinite}
.fanic img{width:72px;height:72px;image-rendering:pixelated}
@keyframes fanwig{50%{transform:rotate(6deg) scale(1.05)}}
.fanroll{display:flex;justify-content:center;margin:10px 0 4px}
.fanrar{font-size:12px}
.fanname{font-size:24px;font-weight:700;margin:4px 0}
.fandesc{font-size:14px;color:var(--ink-dim)}
.fanhow{font-size:13px;color:var(--money);margin-top:10px;padding:6px 10px;border:1px solid rgba(255,214,120,.35);border-radius:8px;background:rgba(255,214,120,.07)}.fanhow b{color:var(--ink-dim);font-weight:normal}
.fanhint{font-size:11px;color:var(--ink-dim);opacity:.7;margin-top:10px}
#wincine{position:fixed;inset:0;z-index:96;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(60,40,8,.9),rgba(8,6,4,.96));animation:wcin .6s ease-out;overflow:hidden;cursor:default;padding:16px;text-align:center}
#wincine.ready{cursor:pointer}#wincine.out{animation:fanout .45s ease-in forwards}
@keyframes wcin{0%{background:#fff8e0}100%{}}
.wcrays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,211,77,.14) 0 8deg,transparent 8deg 16deg);animation:fanspin 18s linear infinite;pointer-events:none}
.wccoin{position:relative;width:clamp(110px,22vmin,180px);perspective:600px;animation:wcdrop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.wccoin img{width:100%;image-rendering:pixelated;border-radius:50%;animation:wcspin 1.8s linear infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
@keyframes wcdrop{from{transform:translateY(-70vh) scale(.4)}}
@keyframes wcspin{to{transform:rotateY(360deg)}}
.wctitle{position:relative;font-size:clamp(40px,9vmin,84px);font-weight:700;color:var(--money);text-shadow:0 4px 0 #8a5a08,0 8px 0 #3a2604}

@keyframes wcletter{from{transform:translateY(40px) scale(.2);opacity:0}}
.wcsub{position:relative;color:var(--ink-dim);animation:fanin .5s 1.5s both}
.wcstats{position:relative;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fanin .5s 1.3s both}
.wcstats div{background:rgba(0,0,0,.45);border-radius:10px;padding:8px 14px;min-width:110px}
.wcstats span{display:block;font-size:12px;color:var(--ink-dim)}.wcstats b{font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.wchint{position:relative;font-size:12px;color:var(--ink-dim);opacity:0;transition:opacity .4s}
#wincine.ready .wchint{opacity:.8}
.coin.frozen::after{content:'';position:absolute;inset:4%;border-radius:50%;border:3px dashed #9be7ff;box-shadow:0 0 12px rgba(155,231,255,.6),inset 0 0 14px rgba(155,231,255,.45);pointer-events:none}

.omentag{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9be7ff;margin-bottom:2px}
.evpanel.omen{box-shadow:0 5px 0 var(--edge),inset 0 0 0 3px #2fa7a0,0 0 40px rgba(47,167,160,.35)}
.lkm{display:grid;gap:6px;background:var(--panel-deep);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.lkm>div{display:grid;grid-template-columns:52px 1fr 130px;align-items:center;gap:8px;font-size:13px}
.lkm>div.lbl{display:block;text-align:center;font-size:11px}
.lkbar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.08)}
.lkbar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.35)}
.lkbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.num small{font-size:16px;color:var(--ink-dim)}
.num.blue{color:var(--chips)} .num.red{color:var(--mult)} .num.gold{color:var(--money)} .num.orange{color:var(--orange)}

/* joker tray */
#jokerbar{display:flex;gap:10px}

  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 3px var(--rc,#e9d9a8),inset 0 0 0 5px var(--rcd,#8a6a2a),inset 0 0 0 7px rgba(0,0,0,.2);transform-origin:50% -8px;
  animation:wob 3.4s ease-in-out infinite;animation-delay:var(--dl,0s);transition:transform .15s}
.jin{transform:perspective(320px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.jcard.hov .jin{transform:perspective(320px) translateY(-4px) scale(1.06) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .06s linear;animation-play-state:paused}

@keyframes wob{0%,100%{rotate:.15 .5 1 -4deg;translate:0 0}25%{rotate:.6 -.3 1 3deg;translate:0 -1px}50%{rotate:-.2 -.6 1 4deg;translate:0 -2px}75%{rotate:-.5 .4 1 -3deg;translate:0 -1px}}

.tilt{position:relative;transform-style:preserve-3d;transform:rotateX(calc(24deg + var(--rx,0deg))) rotateY(var(--ry,0deg));transition:transform .18s ease-out;
  animation:sway 4.6s ease-in-out infinite;animation-delay:var(--sw,0s)}
.coin.hov .tilt{transition:transform .06s linear;animation-play-state:paused}
@keyframes sway{0%,100%{rotate:1 .4 0 -3deg}25%{rotate:.3 1 0 4deg}50%{rotate:1 -.3 0 4deg}75%{rotate:-.2 1 0 -4deg}}
.coin.sel .lift{transform:translateY(-20px)}

.spin{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d}

.face::before{content:attr(data-l);position:absolute;right:-6%;bottom:-6%;min-width:30%;text-align:center;font-size:calc(var(--cs)*.2);font-weight:700;line-height:1.25;color:#fff;background:rgba(14,20,22,.8);border-radius:calc(var(--cs)*.07);text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.35)}

.coin.t-pressed .tilt{transform:none;animation:none}.coin.t-pressed .slab,.coin.t-pressed .face.tails{display:none}.coin.t-pressed .spin{transform:none!important}

.slab{position:absolute;inset:0;background:var(--rim);-webkit-mask:var(--shape) center/100% 100% no-repeat;mask:var(--shape) center/100% 100% no-repeat;
  transform:translateZ(calc(var(--t)*var(--z)));filter:brightness(var(--b))}

.face::before{display:none}
body.badges .face::before{display:block}
.coin.fog .face::before,body.badges .coin.fog .face::before{content:'?';inset:0;width:100%;min-width:0;display:grid;place-items:center;font-size:calc(var(--cs)*.46);background:none;box-shadow:none;color:#d6dde0}
.coin.enter .lift{animation:dropin .45s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--d)}

/* phones: the whole play screen fits on one screen; tall screens scroll inside the main area */
@media (max-width:760px){
  /* size to the part of the screen you can actually see (--vh tracks the visual viewport), clear of notches and status bars */
  html,body{height:var(--vh,100dvh);min-height:0}
  body{overflow:hidden;position:fixed;inset:0}
  #app{height:var(--vh,100dvh);min-height:0;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));gap:6px;overflow:hidden}
  :root{--jw:34px}
  #side{grid-template-columns:1fr 1fr auto;grid-template-areas:"blind blind btns" "score hand hand" "stats stats stats";gap:6px;padding:6px}
  .s-blind{display:flex;align-items:center;min-width:0}
  .s-bname{font-size:15px;padding:5px 8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none}
  .s-binfo{padding:2px 8px;gap:4px}
  .s-binfo .bchip,.s-binfo .lbl,.s-bdesc{display:none}
  .s-binfo:not(:has(.s-target)){display:none}
  .s-target{font-size:20px}
  .s-btns{grid-area:btns;display:flex;flex-direction:column;gap:4px;margin-top:0}
  .s-btns .btn{font-size:11px;padding:3px 7px;box-shadow:0 2px 0 var(--cd)}
  .s-run{padding:1px 4px 1px 0;gap:2px;justify-content:center;box-shadow:inset 0 -2px 0 var(--sc)}
  .s-run .rollscene{width:44px;height:20px}
  .s-run .rollscene .rolltilt{transform:scale(.72)}
  .s-runt{display:none}
  .s-score{padding:4px 6px}
  .s-score .lbl{font-size:10px}
  .s-score .val{font-size:18px;padding:2px 6px}
  .s-hand{padding:4px 6px}
  .hname{font-size:12px;min-height:14px}
  .cm{margin-top:3px}
  .cm .chips,.cm .mult{font-size:17px;padding:2px 6px}
  .stat{padding:2px 3px}
  .stat .lbl{font-size:10px}
  .num{font-size:17px}
  #main{flex:1 1 auto;min-height:0;gap:6px;overflow-y:auto;overflow-x:hidden}
  #jokerbar{flex-direction:row;gap:6px}
  .tray{padding:5px 6px 3px}
  .tray.cons{flex:0 0 auto;min-width:calc(var(--jw)*2 + 22px)}
  .cards{gap:4px;padding-top:6px;min-height:calc(var(--jw) + 8px)}
  .trayfoot{font-size:10px;margin-top:2px}
  .trayfoot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .empty{font-size:10px;max-width:none}
  .jin::before{top:-7px;width:9px;height:9px;margin-left:-4.5px}
  #stage{gap:6px;justify-content:flex-start}
  .table{gap:4px}
  #stage:has(> .controls){justify-content:space-between}
  #stage:has(> .controls) .table{flex:1;justify-content:center}
  .callbanner{font-size:15px;min-height:20px}
  .callbanner b{font-size:17px}
  .purse{padding-top:52px;padding-bottom:10px}
  .hint{font-size:12px;min-height:0}
  .controls{gap:8px;padding-bottom:7px}
  .shop,.packview,.bcol,.panel{margin-bottom:6px}
  .controls .mid{min-width:52px}
  .btn.big{font-size:18px;padding:10px 12px;min-width:104px}
  .blinds{flex-wrap:nowrap;gap:5px}
  .bcol{flex:1 1 0;min-width:0;padding:6px 4px;gap:6px}
  .bcol.select{transform:translateY(-4px)}
  .bstate{min-height:32px}
  .bstate .btn{font-size:13px;padding:6px 4px}
  .bstate span{padding:6px 4px;font-size:12px}
  .bname{font-size:13px;padding:4px 3px}
  .bcol .bchip{--sz:40px!important}
  .blinds .bcol::after{display:none}
  .way .wsub{font-size:10px}.way .jcard{width:44px}
  .bdesc{font-size:11px;min-height:0}
  .btgt{padding:5px 3px}
  .btgt .lbl{font-size:10px}
  .btgt .tv{font-size:19px}
  .tagd{font-size:10px;min-height:0}
  .bskip .btn{font-size:11px;padding:5px 6px}
  #side{flex:none}
  #app[data-screen=shop] .s-score,#app[data-screen=shop] .s-hand,#app[data-screen=pack] .s-score,#app[data-screen=pack] .s-hand{display:none}
  #app[data-screen=shop] #side,#app[data-screen=pack] #side{grid-template-areas:"blind blind btns" "stats stats stats"}
  /* shop */
  .shop{gap:8px;padding:8px}
  .shophead{gap:8px}
  .shopbtns{gap:8px}
  .shopbtns .btn.big{font-size:15px;padding:8px 10px;min-width:0}
  .shopbtns .btn{font-size:13px;padding:7px 10px}
  .slbl{font-size:10px}
  .sect{gap:3px}
  .shelf,.shop .shelf{gap:10px;padding:6px}
  .shoprow2{flex-wrap:nowrap;gap:8px}
  .scard{gap:3px}
  .scard .jcard{width:50px}
  .scard .price{font-size:13px;padding:0 7px}
  .scard .btn.small{font-size:11px;padding:4px 8px}
  .scard .pcap{font-size:9px;white-space:nowrap;max-width:none}
  .shop .slbl{line-height:1}
  .shopbtns{padding-top:0}
  .jin .lab{font-size:8px;bottom:9%}
  .purse.shopp{padding-top:10px;padding-bottom:8px}
  .meltbar{font-size:11px;min-height:0;gap:6px}
  .meltbar .btn{font-size:11px;padding:4px 8px}
  .meltbar:not(:has(.btn)){display:none}
  .purse.shopp{padding-top:6px;padding-bottom:4px}
  /* opened pack */
  .packview{gap:6px;padding:8px}
  .packhead{gap:8px}
  .ptitle{font-size:18px}
  .packhead .lbl{font-size:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .packhead .btn{font-size:12px;padding:6px 10px}
  .popts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 4px;padding:8px 4px}
  .popt{min-width:0}
  .popt .jcard{width:48px}
  .pname{font-size:11px;min-height:0;max-width:100%}
  .pbtns{gap:3px;flex-wrap:wrap;justify-content:center}
  .pbtns .btn.small{font-size:10px;padding:3px 6px}
  .why{font-size:9px;max-width:100%}
}

/* phones, second pass: keep popups clear of the status bar and app headers, compact roll picker, roomier wager cards */
@media (max-width:760px){
  .overlay{padding:calc(14px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));align-items:start}
  .overlay>.modal{margin:auto 0;max-height:100%}
  /* app headers (like the Claude app's) cover the top of the screen, so tips and toasts live at the bottom instead */
  #toasts{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);flex-direction:column-reverse}
  #coach{top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;left:10px!important;right:10px!important;max-height:30vh;overflow:auto}
  body:has(#coach:not([hidden])) #app{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .evchoices>*{flex:1 1 100%}
  .evchoices .btn{font-size:15px;padding:9px 12px;width:100%}
  #toasts .toast{font-size:13px;padding:6px 12px;line-height:1.25}
  body:has(#coach:not([hidden])) #toasts{bottom:calc(100px + env(safe-area-inset-bottom))}
  /* title: Continue gets its own full-width row */
  .titlebtns .trow{flex-wrap:wrap}
  #contbtn{flex:1 1 100%!important;display:flex;flex-direction:column;align-items:center;line-height:1.1}
  #contbtn[hidden]{display:none}
  #contbtn small{display:block;margin:2px 0 0;font-size:11px}
  .modal h2{font-size:24px;margin:2px 0 8px}
  .rolldetail{position:relative;gap:8px;padding:10px 12px}
  .rolldetail>.rollscene{position:absolute;top:2px;right:6px;zoom:.5;pointer-events:none}
  .rolldetail .cbody{min-width:0;gap:6px}
  .rolldetail .cname{font-size:20px!important;padding-right:110px;min-height:54px;display:flex;align-items:center}
  .rolldetail .cdesc{font-size:13px;margin-right:0}
  .rolldetail .stakes .btn.tiny{padding:4px 9px}
  .stakedesc{font-size:12px}
  .seedrow{gap:6px}.seedrow input{width:120px}
  .seedrow .lbl:last-child{display:none}
  .rolldetail .btn.big{font-size:17px;padding:9px 14px;min-width:0}
  .rollgrid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none;overflow:visible;gap:4px}
  .rollcard{padding:6px 2px;font-size:11px;gap:2px}
  .rollcard .rollscene{zoom:.8}
  /* wager picker: use the height a phone has */
  .blinds{gap:6px}
  .bcol{gap:8px;padding:8px 5px}
  .bname{font-size:14px}
  .bcol .bchip{--sz:48px!important}
  .bdesc{font-size:12px}
  .btgt{padding:8px 4px}
  .btgt .lbl{font-size:11px}
  .btgt .tv{font-size:22px}
  .tagd{font-size:11px}
  .bskip .btn{font-size:12px;padding:7px 8px}
}

/* secret: the Drowned Fountain (fishing) */
.logo span.fishdot{cursor:default;pointer-events:auto}
.logo span.fishdot.plip{animation:plip .5s ease-out}
@keyframes plip{0%{transform:translateY(0)}35%{transform:translateY(.12em) scaleX(1.2)}100%{transform:translateY(0)}}
.fishm{width:min(560px,100%);text-align:center}
.fishm h2{color:#9be7ff;margin-bottom:2px}
.fsub{color:var(--ink-dim);font-size:13px;margin:0 auto 10px;max-width:46ch;line-height:1.35}
.pond{position:relative;height:230px;border-radius:14px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 30%,#1f5a6a 0%,#123a48 45%,#0a1f29 100%);box-shadow:inset 0 0 0 3px rgba(155,231,255,.18)}
.pond::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(155,231,255,.18),inset 0 -40px 60px rgba(0,0,0,.35),inset 0 30px 50px rgba(0,0,0,.25);border-radius:14px}
#pondcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.fsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fbob{position:absolute;left:0;top:0;width:24px;height:24px;transform-origin:50% 50%;pointer-events:none;will-change:transform}
.fbin{position:absolute;inset:0}
.fball{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 24%),
   radial-gradient(circle at 42% 38%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%),
   linear-gradient(#ff5245 0 46%,#7a1410 46% 50%,#2a2a2a 50% 56%,#f4f1ea 56%);
  box-shadow:0 3px 4px rgba(0,0,0,.35)}
.fbin::before{content:"";position:absolute;left:50%;top:-11px;width:4px;height:13px;margin-left:-2px;border-radius:2px;background:linear-gradient(90deg,#c8102e,#ff6b5e 45%,#a00d24);box-shadow:0 -3px 0 -1px #ffd34d}
/* floating: the lower half sits under the water */
.fwater{position:absolute;left:-7px;right:-7px;top:52%;bottom:-6px;border-radius:50%/40% 40% 60% 60%;background:linear-gradient(rgba(70,150,175,.75),rgba(10,40,55,.92));opacity:0;transition:opacity .15s}
.fbob.afloat .fwater{opacity:1}
.fbob.afloat .fball{box-shadow:none}
.fshadow{position:absolute;left:-4px;right:-4px;bottom:-5px;height:7px;border-radius:50%;border:2px solid rgba(190,240,255,.45);opacity:0}
.fbob.afloat .fshadow{opacity:1}
.fbob.afloat .fbin{animation:fbob 2.4s ease-in-out infinite}
@keyframes fbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(2px) rotate(3deg)}}
.fbob.nib .fbin{animation:fnib .4s ease-in-out}
@keyframes fnib{40%{transform:translateY(5px) rotate(8deg)}}
.fbob.bite .fbin{animation:fbite .22s ease-in-out infinite alternate}
@keyframes fbite{from{transform:translateY(5px) rotate(-10deg)}to{transform:translateY(12px) rotate(12deg)}}
.fbob.bite .fwater{top:30%}
.fring{position:absolute;width:40px;height:14px;margin:-7px 0 0 -20px;border:2px solid rgba(190,240,255,.7);border-radius:50%;pointer-events:none;animation:fring 1s ease-out forwards}
@keyframes fring{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(2.6)}}
.fdrop{position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;background:#cfefff;pointer-events:none;animation:fdrop .6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fdrop{0%{transform:translate(0,0);opacity:1}60%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(calc(var(--dx)*1.3),calc(var(--dy)*-.2));opacity:0}}
.fbang{position:absolute;left:50%;top:30px;transform:translateX(-50%);font-size:44px;font-weight:700;color:#ffd34d;text-shadow:0 3px 0 #000;opacity:0;pointer-events:none}
.pond.bite .fbang{opacity:1;animation:pop .2s ease-out}
.fcatch{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(5,15,20,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.pond.got .fcatch{opacity:1}
.fcatch img{width:84px;height:84px;image-rendering:pixelated;animation:fjump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes fjump{from{transform:translateY(60px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.fcatch b{font-size:20px}.fcatch small{font-size:12px;color:#cfe;max-width:34ch}
.fnew{color:#ffd34d;font-size:12px;letter-spacing:.12em}
.fmeter{position:relative;height:26px;margin:10px 4px 0;border-radius:13px;background:#0a1f29;box-shadow:inset 0 0 0 2px rgba(155,231,255,.25);overflow:hidden}
.fmeter[hidden]{display:none}
.fzone{position:absolute;top:3px;bottom:3px;border-radius:10px;background:linear-gradient(#4bd18f,#2e7d4f);box-shadow:0 0 10px rgba(75,209,143,.6)}
.fneedle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff}
.fmsg{min-height:22px;margin:10px 0 8px;font-size:15px}
.fbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flog{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px;padding:8px;border-radius:12px;background:var(--panel-deep)}
.flog div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--ink-dim);min-width:0}

.flog span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fstat{font-size:12px;color:var(--ink-dim);margin-top:6px}

.dzone{position:fixed;z-index:69;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;background:color-mix(in srgb,var(--zc) 78%,transparent);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.25);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;opacity:0;transform:scale(.94);transition:opacity .12s,transform .12s,filter .12s}

/* charms that care about a coin make that coin turn up more: each one owned (copies count) adds 3x weight */
let COIN_FAV=null;
function coinFav(){if(COIN_FAV)return COIN_FAV;COIN_FAV={};const names=Object.keys(COINS).map(k=>[k,COINS[k].name]);
  for(const k in JOKERS){const d=JOKERS[k],t=new Set();const src=Object.values(d).filter(f=>typeof f==='function').map(String).join(' ');
    for(const m of src.matchAll(/(?:ctype\([^)]*\)|\.type)\s*===\s*'([a-z0-9]+)'/g))if(COINS[m[1]])t.add(m[1]);
    let ds='';try{ds=String(typeof d.desc==='function'?d.desc(null):d.desc||'')}catch(e){}names.forEach(([c,n])=>{if(ds.includes(n))t.add(c)});
    if(t.size)COIN_FAV[k]=[...t]}
  Object.entries({tourist:['lucky','steel'],foolsgold:['twohead','twotail']}).forEach(([k,a])=>{if(JOKERS[k])COIN_FAV[k]=[...new Set([...(COIN_FAV[k]||[]),...a])]});
  return COIN_FAV}
const coinWeight=t=>{if(!S)return 1;const F=coinFav();let w=1;ownKeys().forEach(k=>{if(k&&F[k]&&F[k].includes(t))w+=3});return w};
function pickSpecial(pool){pool=pool||SPC();if(!pool.length)return pick(SPECIAL);const W=pool.map(coinWeight);let x=rand()*W.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){x-=W[i];if(x<0)return pool[i]}return pool[pool.length-1]}
const SPC=()=>S&&S.roll==='locked'?SPECIAL.filter(t=>!GOAL_OF['coin:'+t]):SPECIAL;
const SPECIAL=Object.keys(COINS).filter(k=>k!=='copper'&&!COINS[k].relic&&!COINS[k].noShop&&!COINS[k].fishLocked);
const relicsLeft=()=>Object.keys(COINS).filter(k=>COINS[k].relic&&!COINS[k].quest&&!(S&&S.purse.some(c=>c.type===k))&&!(k==='pressed'&&S&&S.jokers.some(j=>j.key==='pressedpenny')));

/* stacked coins: two coins share a stack id. They always land on the same face, can't be re-flipped,
   and the pair only takes up one space in your purse */
/* pairs of same-kind coins that aren't stacked yet (for the Poltergeist) */
const polterPairs=()=>{const free={},out=[];S.purse.forEach((c,i)=>{if(stkGroup(c))return;if(c.type in free){out.push([free[c.type],i]);delete free[c.type]}else free[c.type]=i});return out};
const stkGroup=c=>!!S&&!!c&&!!c.stk&&S.purse.filter(x=>x.stk===c.stk).length>=2?c.stk:null;
const purseUsed=()=>S.purse.length-new Set(S.purse.filter(c=>stkGroup(c)).map(c=>c.stk)).size;
function applyStacks(){const seen={};S.purse.forEach((c,i)=>{const g=stkGroup(c);if(!g)return;if(g in seen)S.results[i]=S.results[seen[g]];else seen[g]=i})}

function packArt(k,size='normal'){
  const key=k+':'+size;if(PACK_IMG[key])return PACK_IMG[key];const A=PACK_PIX[k];if(!A)return packIcon(k);
  const N=18,cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d'),grid=Array.from({length:N},()=>Array(N).fill(null));
  const shade=(h,t)=>{const n=parseInt(h.slice(1),16);return'#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v*t).toString(16).padStart(2,'0')).join('')};
  const put=(ox,oy,dim)=>A[1].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.'||ch===' ')return;const c=A[0][ch]||'#fff';grid[oy+y][ox+x]=dim?shade(c,dim):c}));
  if(size==='mega'){put(1,1,.45);put(3,3,.65);put(5,5)}else if(size==='jumbo'){put(1,1,.55);put(4,4)}else put(3,3);
  const filled=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&grid[y][x];
  g.fillStyle='#1a1218';for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y][x])continue;if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1))g.fillRect(x,y,1,1)}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x]){g.fillStyle=grid[y][x];g.fillRect(x,y,1,1)}
  if(size==='mega'){g.fillStyle='#ffd34d';[[15,0],[14,1],[15,1],[16,1],[15,2]].forEach(([x,y])=>g.fillRect(x,y,1,1));g.fillStyle='#fff6d0';g.fillRect(15,1,1,1)}
  return PACK_IMG[key]=cv.toDataURL();
}

function mysteryInner(){const x=rand();
  if(x<.16)return{kind:'coin',type:pickSpecial(SPC()),wear:rand()<.3?pick(COIN_WEARS):null};
  if(x<.30)return{kind:'charm',key:rollJokerKey()};
  if(x<.44)return{kind:'rune',key:pick(Object.keys(RUNES))};
  if(x<.56)return randAlmanac();
  if(x<.64)return{kind:'spirit',key:pick(Object.keys(SPIRITS).filter(k=>k!=='soul'))};
  if(x<.74)return{kind:'fortune',key:pick(Object.keys(FORTUNES))};
  if(x<.90)return{kind:'cash',v:1+Math.floor(rand()*9)};
  if(x<.92&&relicsLeft().length)return{kind:'coin',type:pick(relicsLeft())};
  return{kind:'junk'}}
function grantMystery(it){
  if(it.kind==='cash'){S.money+=it.v;return `<b>$${it.v}</b>`}
  if(it.kind==='junk'){addLuck(1);return 'some pocket lint. At least your luck feels a little better'}
  if(it.kind==='coin'){if(purseUsed()<S.purseMax){S.purse.push({...mkCoin(it.type),wear:it.wear||null});return `a <b>${COINS[it.type].name}</b>`}S.money+=4;return `a ${COINS[it.type].name}, but your purse is full, so you sell it for $4`}
  if(it.kind==='charm'){if(S.jokers.length<slots()){addJoker(it.key,JOKERS[it.key].cost);return `the <b>${JOKERS[it.key].name}</b> Charm`}S.money+=5;return `${JOKERS[it.key].name}, but you have no room, so you sell it for $5`}
  const nm=consInfo(it).name;if(consRoom()){S.cons.push(it);return `<b>${nm}</b>`}S.money+=3;return `${nm}, but you have no room, so you sell it for $3`}
function genPackOpts(pk,n){
  const opts=[],k=pk.kind,uniq=(f,key)=>{let v,t=0;do{v=f();t++}while(opts.some(o=>o[key]===v[key]&&o.kind===v.kind)&&t<30);opts.push(v)};
  for(let i=0;i<n;i++){
    if(k==='charm')uniq(()=>{if(pk.size==='mega'&&rand()<odds(1/40)){const fb=Object.keys(JOKERS).filter(x=>JOKERS[x].r===5&&!S.jokers.some(j=>j.key===x));if(fb.length)return{kind:'charm',key:pick(fb)}}return{kind:'charm',key:rollJokerKey()}},'key');
    else if(k==='fortune')uniq(()=>({kind:'fortune',key:pick(Object.keys(FORTUNES))}),'key');
    else if(k==='forecast')uniq(()=>({kind:'wx',key:i===0&&S.weather?'clear':pick(Object.keys(WEATHER))}),'key');
    else if(k==='contract')uniq(()=>({kind:'contract',key:pick(Object.keys(CONTRACTS))}),'key');
    else if(k==='mint')uniq(()=>rand()<.55?{kind:'mod',mod:'wear',key:pick(COIN_WEARS)}:{kind:'mod',mod:'defect',key:pick(Object.keys(DEFECTS))},'key');
    else if(k==='workshop')uniq(()=>({kind:'cwear',key:pick(Object.keys(WEARS))}),'key');
    else if(k==='exchange')uniq(()=>({kind:'swap',type:rand()<.12&&relicsLeft().length?pick(relicsLeft()):pickSpecial(SPC().filter(t=>COINS[t].cost>=4))}),'type');
    else if(k==='mystery')opts.push({kind:'myst',inner:mysteryInner()});
    else if(k==='cursed')uniq(()=>{const legs=Object.keys(JOKERS).filter(x=>JOKERS[x].r===4&&isUnlocked('charm',x));const key=legs.length&&rand()<.12?pick(legs):rollJokerKey(rand()<.4?3:2);return{kind:'charm',key,curse:pickCurse(key)}},'key');
    else if(k==='relic')uniq(()=>{const rl=relicsLeft().filter(t=>!opts.some(o=>o.type===t));return{kind:'coin',type:rl.length?pick(rl):pickSpecial(SPC())}},'type');
    else if(k==='chest'){[{kind:'coin',type:pickSpecial(SPC()),wear:rand()<.3?pick(COIN_WEARS):null},{kind:'charm',key:rollJokerKey()},{kind:'rune',key:pick(Object.keys(RUNES))},randAlmanac()].forEach(o=>opts.push(o));break}
    else if(k==='glitch')uniq(()=>{const x=rand();
      if(x<.25){const gl=Object.keys(JOKERS).filter(q=>JOKERS[q].glitchOnly&&!S.jokers.some(j=>j.key===q));if(gl.length)return{kind:'charm',key:pick(gl)}}
      if(x<.45)return{kind:'coin',type:pickSpecial(SPC()),wear:pick(COIN_WEARS),defect:pick(Object.keys(DEFECTS))};
      if(x<.65)return{kind:'charm',key:rollJokerKey(rand()<.5?3:2),wear:pick(COIN_WEARS)};
      const y=rand(),it=y<.3?{kind:'rune',key:pick(Object.keys(RUNES))}:y<.5?{kind:'spirit',key:pick(Object.keys(SPIRITS).filter(q=>q!=='soul'))}:y<.75?{kind:'fortune',key:pick(Object.keys(FORTUNES))}:randAlmanac();
      return{kind:'gdup',item:it,key:'d'+(it.key||it.hand)}},'key');
    else if(k==='dossier'){const cur=S.blinds[2].boss,fin=BOSSES[cur].final;uniq(()=>({kind:'boss',key:pick(Object.keys(BOSSES).filter(b=>b!==cur&&!BOSSES[b].glitchOnly&&!BOSSES[b].rivalOnly&&!BOSSES[b].houseOnly&&!!BOSSES[b].final===!!fin))}),'key')}
  }
  return opts;
}

const consDef=c=>c.kind==='fortune'?FORTUNES[c.key]:c.kind==='rune'?RUNES[c.key]:c.kind==='spirit'?SPIRITS[c.key]:c.kind==='almanac'&&c.key?ALMS[c.key]:null;
function consBlock(c,fromSlot){
  const d=consDef(c);
  const canPick=S.screen==='shop'||(S.screen==='play'&&S.phase==='call');
  if(S.screen==='play'&&S.phase!=='call')return 'Use it between tosses';
  if(!d)return null;
  if(d.min){if(!canPick)return 'Select coins in the shop or between tosses';
    if(S.csel.length<d.min||S.csel.length>d.max)return d.min===d.max?`Select ${d.min} coin${d.min>1?'s':''}`:`Select ${d.min} to ${d.max} coins`}
  usingFromSlot=!!fromSlot;const ok=!d.ok||d.ok();usingFromSlot=false;
  return ok?null:(d.why||'Not right now');
}
async function applyCons(c,fromSlot){
  const sel=S.csel.slice().sort((a,b)=>a-b);S.csel=[];
  if(c.kind==='almanac'){S.stats.almanacs++;PS().almanacs++;S.lastUsed=c.key?{kind:'almanac',key:c.key}:{kind:'almanac',hand:c.hand};render();if(c.key)await ALMS[c.key].use();else await levelUp(c.hand);return}
  const d=consDef(c);
  if(c.kind==='rune')PS().runes++;else if(c.kind==='spirit')PS().spirits++;
  if(c.kind==='rune'){S.stats.runes++;if(c.key!=='echo')S.lastUsed={kind:'rune',key:c.key}}
  else play('spirit');
  if(charmsOn()){
    if(c.kind==='rune')for(let k=0;k<countEff('moonstone');k++)if(rand()<odds(1/3)){setTimeout(()=>{if(consRoom()){S.cons.push({kind:'rune',key:c.key});toast(`<b>Moonstone</b> returns the <b>${consDef(c).name}</b>`);render()}},700);break}
    if(c.kind==='spirit'){S.jokers.forEach(j=>{if(j.key==='lantern')j.st.x=Math.round((j.st.x+.5)*100)/100});
      for(let k=0;k<countEff('ouija');k++)setTimeout(()=>{if(consRoom()){S.cons.push({kind:'rune',key:pick(Object.keys(RUNES))});toast('The <b>Ouija Board</b> spells out a Rune');render()}},700)}}
  if(d.to){PS().transmutes+=sel.length;sel.forEach(i=>{S.purse[i].type=d.to});render();sel.forEach(i=>juiceCoin(i,'Transmuted!'));play('levelup');return}

/* ================= LUCK & KARMA (hidden) =================
   Luck nudges chances: lucky odds, coins landing on your call, edges, rarer shop charms, better pack finds.
   Karma nudges people: shop prices, curses, encounters, and the odd tip or toll at cash-out.
   Both shift with what you carry and what you do, and only show through hints (and the Crystal Ball). */
function luckNow(){
  if(!S)return 0;if(hasK('tyche'))return 10;
  if(S.screen==='play'&&bossIs('obsidian'))return -10;
  let v=S.luck||0;ownKeys().forEach(k=>{if(k)v+=JOKERS[k].luck||0});
  S.purse.forEach(c=>{if(c.type==='lucky')v+=1;else if(c.type==='penny')v+=2;else if(c.type==='hope')v-=2});
  if(hasK('blackcat'))v-=2;v+=nK('jester');v-=2*S.jokers.filter(j=>j.curse==='jinxed'&&!hasK('guardianangel')).length;
  if(S.screen==='play'&&bossIs('blackcat'))v=Math.min(v,-8);
  return clamp(Math.round(v),-10,10);
}
function karmaNow(){
  if(!S)return 0;if(hasK('bodhi'))return 10;
  let v=S.karma||0;ownKeys().forEach(k=>{if(k)v+=JOKERS[k].karma||0});S.jokers.forEach(j=>{if(j.curse)v+=1});
  v-=S.purse.filter(c=>c.type==='twohead'||c.type==='twotail').length;
  if(hasK('pickpocket'))v-=2;
  return clamp(Math.round(v),-10,10);
}
const fmtSign=v=>(v>0?'+':'')+v;
const luckWord=v=>v>=8?'blessed':v>=4?'lucky':v>0?'a little lucky':v===0?'even':v>-4?'a little unlucky':v>-8?'unlucky':'cursed';
const karmaWord=v=>v>=8?'saintly':v>=4?'good':v>0?'decent':v===0?'balanced':v>-4?'shady':v>-8?'bad':'wicked';
function addLuck(n){if(!S)return;S.luck=clamp((S.luck||0)+n,-10,10);lkCheck()}
function addKarma(n){if(!S)return;S.karma=clamp((S.karma||0)+n,-10,10);if(n>0)PS().goodDeeds++;lkCheck()}
const LUCK_MSG={2:'You feel <b>incredibly lucky</b>.',1:'You feel <b>lucky</b>.',0:'Your luck <b>evens out</b>.',[-1]:'You feel <b>a little unlucky</b>.',[-2]:'A <b>black cloud</b> follows you.'};
const KARMA_MSG={2:'You feel a <b>warm glow</b>.',1:'You feel <b>at peace</b>.',0:'You feel <b>balanced</b>.',[-1]:'You feel <b>watched</b>.',[-2]:'Something <b>wants payment</b>.'};
function lkCheck(){
  if(!S||S.screen==='over'||S.screen==='win')return;
  const L=luckNow(),K=karmaNow(),P=PS();
  P.luckHi=Math.max(P.luckHi,L);P.luckLo=Math.min(P.luckLo,L);P.karmaHi=Math.max(P.karmaHi,K);P.karmaLo=Math.min(P.karmaLo,K);
  const band=v=>v>=8?2:v>=4?1:v<=-8?-2:v<=-4?-1:0,bl=band(L),bk=band(K);
  if(!S.lkb){S.lkb={l:bl,k:bk};return}
  if(bl!==S.lkb.l)toast(LUCK_MSG[bl]);
  if(bk!==S.lkb.k)toast(KARMA_MSG[bk]);
  S.lkb={l:bl,k:bk};
}

function pixelize(svg,w,h,pal){return new Promise(res=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h),P=pal.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
  for(let i=0;i<d.data.length;i+=4){if(d.data[i+3]<120){d.data[i+3]=0;continue}let best=0,bd=1e9;for(let k=0;k<P.length;k++){const dr=d.data[i]-P[k][0],dg=d.data[i+1]-P[k][1],db=d.data[i+2]-P[k][2],dd=dr*dr*2+dg*dg*3+db*db;if(dd<bd){bd=dd;best=k}}d.data[i]=P[best][0];d.data[i+1]=P[best][1];d.data[i+2]=P[best][2];d.data[i+3]=255}
  g.putImageData(d,0,0);res(cv.toDataURL())};img.onerror=()=>res('');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="'+w*4+'" height="'+h*4+'" '))})}
const thick=svg=>svg.replace(/stroke-width="(\d+)"/g,(m,v)=>`stroke-width="${Math.round(v*1.7)}"`);
let HZ_FR=null;

  const gB=thick(GHOST_SVG).replace('<g class="garm gl">','<g transform="rotate(10 110 130)">').replace('<g class="garm gr">','<g transform="rotate(-12 220 140)">');

  HZ_FR=Promise.all([pixelize(gA,64,62,HZ_PAL.ghost),pixelize(gB,64,62,HZ_PAL.ghost),pixelize(sA,48,45,HZ_PAL.scorp),pixelize(sB,48,45,HZ_PAL.scorp)]).then(([a,b,c,d])=>({ghost:[a,b],scorp:[c,d]}));return HZ_FR}

  if(turn){S.wagerTime=(S.wagerTime||0)+dt;S.turnTime=(S.turnTime||0)+dt}

  if(!S.ghost&&!S.ghostWarned&&S.wagerTime>=GHOST_AFTER-20){S.ghostWarned=true;toast('<i>You feel a chill. Something is drifting this way...</i>',4500)}

    if(turn&&!S.scorp&&left<=0)summonScorp()}

  if(gh){const t=hzTarget('coin'),gr=gh.getBoundingClientRect();if(t){const q=t.getBoundingClientRect(),tx=q.left+q.width/2-gr.width/2,ty=q.top-gr.height*.55;const cx=gr.left,cy=gr.top;hzMove(gh,cx+(tx-cx)*.08,cy+(ty-cy)*.08)}}

const RULES=`<ol class="rules">
 <li>Call <b>Heads</b> or <b>Tails</b>, then every coin in your purse gets tossed.</li>
 <li>Coins that land on your call score. Matches side by side make better tosses: Double, Triple, Four Streak, all the way to a <span class="k-a">Clean Sweep</span>.</li>

 <li>Runes that change coins need targets: tap coins to select them, then use the Rune. Keep up to 2 consumables for later.</li>
 <li>Coins and Charms can carry <b>Wear</b> (bonus Points or Mult, or an extra Charm slot). Coins can also carry one <b>Defect</b> (money, retriggers, Runes or Almanacs). Spirits add them, and Coin Pouches sometimes hold modified coins.</li>
 <li>Very rarely a coin lands on its <span class="k-a">edge</span>. Edge coins always score with <span class="k-x">X2</span> Mult.</li>
 <li>On the <b>first toss</b> of a wager you can <b>Bet all</b> your money on 4+ hits: double or nothing. Betting means <b>no re-flips</b> for that toss.</li>
 <li>Each toss type gains <b>+1 Mult</b> for every 10 times you score it (mastery). There are 8 stages. Targets climb steeply, and from stage 6 every Boss has a second rule. Coins flipped 50 times get <b>Polished</b> for free.</li>
 <li>Encounters bring a choice to make, and are worth about as much as a shop visit. Some Charms are <b>Cursed</b> (Rusted, Bound, Fleeting, Brittle, Heavy, Hungry, Jinxed, Rented). Cursed Charms in the shop cost <b>half</b>.</li>
 <li>The <b>Tightrope</b> Charm and <b>Balance Point</b> Spirit unlock the <b>Edge</b> call.</li>
 <li>Every stage is a <b>floor</b> of the House, and the House is always watching. After each wager, choose <b>where next</b>: the shop, or a detour in its place. Encounters, a Rest, a Treasure, a rare Bazaar, the Pawnshop, a face-down Mystery, a deal with <b>the House</b> itself, your <b>Rival</b> or an <b>Elite Wager</b>. With a bad reputation the Back Room opens; with a good one, the Chapel.</li>
 <li><b>Tickets</b> come from duels, Elite Wagers and contracts. Spend them at the Prize Counter on Charms you can't buy anywhere else.</li>
 <li>The <b>Rune of Stacking</b> stacks two coins: they always land on the same face, share one purse space, and re-flip together as one.</li>
 <li>Keys: <b>H</b> / <b>T</b> / <b>E</b> to call, <b>R</b> to re-flip, <b>Space</b> to cash in.</li></ol>`;

 o_clover:{omen:1,title:'Clover in the Carpet',text:()=>`Clover grows up through the casino carpet, as if something alive got in. ${luckHint()}`,

 o_shrine:{omen:1,title:'The Altar of Chips',text:()=>{const K=karmaNow();return `Between two slot machines stands a little altar, piled with chips left by the desperate. ${K>=7?'The candles blaze up as you approach.':K>=3?'The candles burn warm and steady.':K>-3?'The candles flicker uncertainly.':K>-7?'The candles gutter as you approach.':'Every candle goes out at once.'}`},

 housedeal:{mapOnly:1,avail:()=>false,title:'The House',text:'Behind a door with no handle, the House is waiting. It has no face, only a voice, and the voice is pleased to see you. "Let us make a deal. Something you keep forever, for something you want now."',
  get choices(){const o=S.event.offer||(S.event.offer={d:(()=>{const ok=Object.keys(HOUSE_DEALS).filter(k=>HOUSE_DEALS[k].ok());const a=[];while(a.length<2&&ok.length)a.push(ok.splice(Math.floor(rand()*ok.length),1)[0]);return a})()});

    if(S.lastSold)c.push({label:`Buy back your ${JOKERS[S.lastSold].name} ($${JOKERS[S.lastSold].cost})`,ok:()=>S.money>=JOKERS[S.lastSold].cost&&S.jokers.length<slots(),why:'Needs the money and a free Charm slot',run:()=>{const k=S.lastSold;S.money-=JOKERS[k].cost;addJoker(k,JOKERS[k].cost);S.lastSold=null;play('buy');return `Your {a:${JOKERS[k].name}} is back where it belongs.`}});
    c.push({label:'Pawn a special coin ($9)',ok:()=>specialCount()>0&&S.purse.length>PURSE_MIN&&S.roll!=='hoarder',why:'Needs a special coin and more than 3 coins',run:()=>{const co=pick(S.purse.filter(x=>x.type!=='copper'));S.purse.splice(S.purse.indexOf(co),1);S.money+=9;play('money');return `Your ${COINS[co.type].name} goes behind the bars. {$:$9}.`}});

function eventHTML(){
  const E=EVENTS[S.event.key];
  if(!S.event.text)S.event.text=typeof E.text==='function'?E.text():E.text;

let titleBusy=false,titleRun={f:null,n:0};

async function titleToss(){
  const el=$('.bigcoin'),sp=el&&el.querySelector('.spin');if(!sp||titleBusy)return;titleBusy=true;audioInit();
  const cur=getComputedStyle(sp).transform,tok=++titleTok;if(titleAnim){titleAnim.cancel();titleAnim=null}el.classList.add('tossing');

function rollJokerKey(minR){
  const owned=new Set([...S.jokers.map(j=>j.key),...(S.shop?S.shop.jokers.filter(j=>j.key).map(j=>j.key):[])]);
  if(!minR&&rand()<odds(1/200)){const fb=Object.keys(JOKERS).filter(k=>JOKERS[k].r===5&&!owned.has(k)&&isUnlocked('charm',k));if(fb.length)return pick(fb)}
  if(!minR&&S.curator&&rand()<1/40){const lg=Object.keys(JOKERS).filter(k=>JOKERS[k].r===4&&!owned.has(k));if(lg.length)return pick(lg)}
  const x=clamp(rand()-luckNow()*.012,0,.999);let r=minR||(x<(S.patron?.5:.7)?1:x<(S.patron?.85:.95)?2:3);
  const base=Object.keys(JOKERS).filter(k=>JOKERS[k].r<4&&!JOKERS[k].glitchOnly&&!JOKERS[k].prize&&!JOKERS[k].artifact&&isUnlocked('charm',k));
  let pool=base.filter(k=>JOKERS[k].r===r&&!owned.has(k));
  if(!pool.length)pool=base.filter(k=>!owned.has(k));
  if(!pool.length)pool=base;
  return pick(pool);
}

function genWays(){
  if(!S.wayStage||S.wayStage.ante!==S.ante)S.wayStage={ante:S.ante,used:[]};
  const used=S.wayStage.used,rr=S.roll==='rivalroll';
  const K=karmaNow(),pool=[['encounter',5],['rest',2],['treasure',1.4],['bazaar',.7],['house',.9],['mystery',1]];
  if(S.jokers.length||specialCount()||S.lastSold)pool.push(['pawn',1.2]);
  if(K<=-3)pool.push(['backroom',2.2]);if(K>=3)pool.push(['chapel',2.2]);
  if((S.tickets||0)>=3)pool.push(['prize',1.6]);
  if(!used.includes('rival'))pool.push(['rival',rr?50:2]);
  if(!used.includes('elite')&&S.ante>=2&&!rr)pool.push(['elite',2]);
  const out=[];let n=1; /* always two choices: the shop and one detour */
  while(n-->0&&pool.length){const tot=pool.reduce((a,x)=>a+x[1],0);let x=rand()*tot,k=0;for(;k<pool.length-1;k++){x-=pool[k][1];if(x<0)break}out.push(pool.splice(k,1)[0][0])}
  return [{t:'shop'},...out.map(t=>{const w={t};if(t==='elite'){w.boss=pick(BOSS_POOL.filter(b=>!['wall','needle','judge'].includes(b)));w.boss2=S.ante>=4?pick(SECOND_BOSS.filter(k=>k!==w.boss)):null}return w})];
}

/* Rivals duel you head to head: they flip first each round, you see their score and have to beat it by your 3rd Flip.
   Each one has a habit that shapes the duel, a signature coin and a favourite toss they can teach you. */
const RIVAL_OF={

 'The Drifter':{short:'Drifter',style:'callit',coin:'copper',fav:'pair',habit:'Before each toss he flips a coin. Heads, his toss is {r:huge}. Tails, it is {a:tiny}'},
 'Connie Kurrency':{short:'Connie',style:'pump',coin:'crypto',fav:'mirror',habit:'Pumps her tosses with your wallet: {r:+3%} for every {$:$1} you hold'},
 'Uncle Moneybags':{short:'Moneybags',style:'rules',coin:'jade',fav:'four',habit:'{r:No} Re-flips for you in this duel, but his tosses are smaller'},
 "Cap'n Pinchclaw":{short:'Pinchclaw',style:'greedy',coin:'gold',fav:'twin',habit:'Each Re-flip you use makes his next toss {r:10%} bigger'},
 'The Scarred D.A.':{short:'D.A.',style:'twoface',coin:'twohead',fav:'bookends',habit:'Big tosses, but one of his three is always a {a:Bust}'},
 'Old Moneybin':{short:'Moneybin',style:'saver',coin:'sixpence',fav:'five',habit:'Starts slow and finishes big'},
 'The Plant Baron':{short:'Baron',style:'hounds',coin:'platinum',fav:'six',habit:'His {a:final} toss counts {r:double}'},
};
const RIVALS=Object.keys(RIVAL_OF);
const rivalInfo=()=>RIVAL_OF[S.rival.name]||(S.rival.name=RIVALS[0],RIVAL_OF[RIVALS[0]]);
/* a relic only once: if you already hold it, they hand over a Loonie instead */
const rivalCoin=()=>{const c=rivalInfo().coin;return COINS[c].relic&&S.purse.some(x=>x.type===c)?'silver':c};
/* rematches: a rival you've beaten before comes back sharper (+40% tosses) for a bigger stake */
const isRematch=()=>!!S&&!!S.rival&&!!(PS().rivalsBeat||{})[S.rival.name];
const rivalStake=()=>Math.round((4+2*S.rival.lvl)*(isRematch()?1.5:1));
function rivalToss(){
  const D=S.duel,k=D.shown,tn=D.table?D.order[k%D.order.length]:null,who=D.table?tn:D.general?'The General':S.rival.name,st=D.table?RIVAL_OF[tn].style:D.general?'general':rivalInfo().style;
  let m=.85+rand()*.3;
  if(st==='callit'){D.called=rand()<.5;m=D.called?1.8:.3}
  else if(st==='steady')m=1.02;
  else if(st==='saver')m=[.6,1,1.5][Math.min(2,Math.floor(k*3/D.n))]*(.9+rand()*.2);
  else if(st==='twoface')m=k===D.bust?.08:1.4*(.9+rand()*.2);
  else if(st==='rules')m*=.8;
  if(st==='general')m=(.95+rand()*.1)*(1+.08*S.purse.filter(c=>c.type==='copper').length)*(k===D.n-1?1.3:1);
  if(st==='hounds'&&k===D.n-1)m*=2;
  if(st==='greedy')m*=1+.1*(S.wagerReflips-D.sal);
  if(st==='pump')m*=1+.03*Math.max(0,S.money);
  let v=Math.round(D.base*m);

(function wxFX(){

      for(const p of P){p.y+=5+p.v*5;p.x-=1.4;if(p.y>H+10){p.y=-10;p.x=Math.random()*W*1.15}g.moveTo(p.x,p.y);g.lineTo(p.x+2,p.y-7-p.v*5)}g.stroke();
      if(k==='storm'&&Math.random()<.0025){flash=.7;setTimeout(()=>play('thunder'),300+Math.random()*700)}}
    else if(k==='snow'){g.fillStyle='rgba(255,255,255,.75)';for(const p of P){p.y+=.35+p.v*.7;p.x+=Math.sin(t*1.3+p.s*6)*.35;if(p.y>H){p.y=-3;p.x=Math.random()*W}const z=p.v>.6?2:1;g.fillRect(p.x|0,p.y|0,z,z)}}
    else if(k==='windy'){g.strokeStyle='rgba(225,245,235,.28)';g.beginPath();for(const p of P){p.x+=3.5+p.v*4;p.y+=Math.sin(t*2+p.s*9)*.5;if(p.x>W+50){p.x=-50;p.y=Math.random()*H}g.moveTo(p.x,p.y);g.lineTo(p.x-18-p.v*24,p.y)}g.stroke();
      g.fillStyle='rgba(200,170,90,.6)';for(let i=0;i<8;i++){const p=P[i];g.fillRect((p.x*1.3)%W|0,p.y|0,2,1)}}
    else if(k==='mist'){for(const p of P){p.x+=.12+p.v*.2;if(p.x>W+140)p.x=-140;const r=70+p.s*90,gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,'rgba(225,232,236,.13)');gr.addColorStop(1,'rgba(225,232,236,0)');g.fillStyle=gr;g.fillRect(p.x-r,p.y-r,r*2,r*2)}}

      g.fillStyle='rgba(240,235,255,.16)';g.beginPath();g.arc(W*.86,H*.13,18,0,7);g.fill();g.fillStyle='rgba(240,235,255,.22)';g.beginPath();g.arc(W*.86,H*.13,12,0,7);g.fill()}
    else if(k==='sunshine'){g.save();g.translate(W*.08,-H*.06);g.rotate(t*.04);for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.fillStyle='rgba(255,225,130,.045)';g.beginPath();g.moveTo(0,0);g.lineTo(W*1.6,-50);g.lineTo(W*1.6,50);g.fill()}g.restore()}
    else if(k==='rainbow'){['#ff5f6d','#ffa21f','#ffd34d','#4bd18f','#0b9bff','#9a6fdc'].forEach((c,i)=>{g.strokeStyle=c;g.globalAlpha=.13;g.lineWidth=5;g.beginPath();g.arc(W/2,H*1.15,H*.98-i*5,Math.PI,2*Math.PI);g.stroke()});g.globalAlpha=1}
